<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sri Shakti Shala is a living school for women and the home of Sheetal Kandola's Shakti Shadow & Somatics work."
    />
    <title>Sri Shakti Shala</title>

    <!-- Fonts are SELF-HOSTED. Do not replace this with a Google Fonts link.

         Loading from fonts.googleapis.com sends every visitor's IP to Google
         before they have consented to anything. A Munich court (LG Muenchen I,
         Jan 2022) awarded damages for exactly that, and it began a wave of
         German demand letters. Self-hosting removes the third-party request.

         The original comment here explained why fonts load as a <link> rather
         than a CSS @import: a failed @import makes Vite's preload helper
         reject the whole chunk, which once took /begin and /shala down
         completely. That reasoning still holds, so this stays a <link>. -->
    <link rel="preload" as="font" type="font/woff2"
          href="/fonts/Manrope-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2"
          href="/fonts/CormorantGaramond-500-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
